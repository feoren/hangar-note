<!doctype html>
<!--
  The sticky note scene: one sticky note window (the app with the window label of a note, see
  src/main.tsx) as it sits on a calm desktop. The window keeps its real size and is drawn a little
  larger, so its text reads like the main window's in the other screenshots.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>README-SHOTS-HARNESS</title>
    <style>
      :root {
        --desk: #1c222b;
        --window-shadow: rgb(0 0 0 / 55%);
        --window-edge: rgb(255 255 255 / 8%);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --desk: #e6eaef;
          --window-shadow: rgb(31 35 40 / 22%);
          --window-edge: rgb(31 35 40 / 12%);
          color-scheme: light;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--desk);
        overflow: hidden;
      }
      .window {
        /* A sticky note's default size is 320 x 320 (bounds.rs); this one was pulled a bit larger
           for its checklist. */
        width: 360px;
        height: 380px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--window-edge),
          0 18px 48px var(--window-shadow);
        transform: scale(var(--zoom, 1.5));
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <iframe title="Sticky note" src="./index.html?window=note-general-e5f6a1b2c3d4"></iframe>
    </div>
  </body>
</html>
